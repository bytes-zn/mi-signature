name: bytes-signature-service

# Log rotation: without it the JSON logs fill up the disk, which is one of
# the most common causes of unplanned downtime.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-signature}:${POSTGRES_PASSWORD:-signature}@db:5432/${POSTGRES_DB:-signature}
  REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-password}@redis:6379/0
  OPERATOR_API_KEY: ${OPERATOR_API_KEY:-dev-operator-key}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
  HTTPS_REDIRECT: ${HTTPS_REDIRECT:-false}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-10485760}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMTP_OUTBOUND_DEFAULT_HOST: ${SMTP_OUTBOUND_DEFAULT_HOST:-}
  SMTP_OUTBOUND_PORT: ${SMTP_OUTBOUND_PORT:-25}
  SMTP_OUTBOUND_STARTTLS: ${SMTP_OUTBOUND_STARTTLS:-true}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signature}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signature}
      POSTGRES_DB: ${POSTGRES_DB:-signature}
    # Bound to localhost only - the database is not reachable from outside.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis-dev-password}
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis-dev-password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    build: .
    restart: "no"
    logging: *default-logging
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status in (200,503) else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    build: .
    restart: unless-stopped
    logging: *default-logging
    command: ["celery", "-A", "app.jobs.celery_app", "worker", "--loglevel=INFO"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.jobs.celery_app inspect ping --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  scheduler:
    build: .
    restart: unless-stopped
    logging: *default-logging
    command: ["celery", "-A", "app.jobs.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  smtp:
    build: .
    restart: unless-stopped
    logging: *default-logging
    command: ["python", "-m", "app.mailer.smtp_server"]
    environment:
      <<: *app-env
      # The container process runs as the non-root "app" user and therefore
      # listens on 2525; Docker maps the public SMTP port to it.
      SMTP_INBOUND_HOST: 0.0.0.0
      SMTP_INBOUND_PORT: 2525
      SMTP_INBOUND_TLS_CERTFILE: ${SMTP_INBOUND_TLS_CERTFILE:-/certs/fullchain.pem}
      SMTP_INBOUND_TLS_KEYFILE: ${SMTP_INBOUND_TLS_KEYFILE:-/certs/privkey.pem}
      SMTP_INBOUND_REQUIRE_TLS: ${SMTP_INBOUND_REQUIRE_TLS:-true}
      SMTP_ALLOWED_HOSTS: ${SMTP_ALLOWED_HOSTS:-}
      SMTP_RELAY_HOSTNAME: ${SMTP_RELAY_HOSTNAME:-}
      SMTP_OUTBOUND_DEFAULT_HOST: ${SMTP_OUTBOUND_DEFAULT_HOST:-}
    ports:
      - "${SMTP_PUBLIC_PORT:-25}:2525"
    volumes:
      - ${SMTP_CERT_DIR:-./certs}:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.create_connection(('127.0.0.1',2525),5); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
  redis_data:
