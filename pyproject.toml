[project]
name = "bytes-signature-service"
version = "0.1.0"
description = "White-label backend platform for server-side email signatures in Microsoft 365"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "celery>=5.4",
    "prometheus-client>=0.21",
    "httpx>=0.28",
    "jinja2>=3.1",
    "msal>=1.31",
    "msgraph-sdk>=1.16",
    "resend>=2.0",
    "aiosmtpd>=1.4",
    "aiosmtplib>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "black>=24.10",
    "isort>=5.13",
    "mypy>=1.14",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ASYNC", # flake8-async
]
ignore = []

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["."]
known_first_party = ["app", "tests"]

[tool.mypy]
python_version = "3.13"
mypy_path = "."
packages = ["app", "migrations"]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["celery.*", "prometheus_client.*", "msal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
# Scripts include dev tools that don't follow app conventions.
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
